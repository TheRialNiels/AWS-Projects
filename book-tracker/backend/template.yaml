AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS SAM Template for Book Tracker App

Parameters:
  AppName:
    Type: String
    Default: book-tracker-app
    Description: Application name
  AllowOrigin:
    Type: String
    Default: http://localhost:3000
    Description: Define the allow origin for CORS
  AllowCredentials:
    Type: String
    Default: "'true'"
    Description: Boolean variable to specify credentials for CORS headers
  Environment:
    Type: String
    Default: prod
    Description: Define the runtime environment for the application
    MinLength: 3
  BookHandlersPath:
    Type: String
    Default: src/handlers/v2/books

Globals:
  Function:
    Architectures:
      - x86_64
    Runtime: nodejs22.x
    CodeUri: .
    Timeout: 60
    Environment:
      Variables:
        ALLOW_ORIGIN: !Ref AllowOrigin
        ALLOW_CREDENTIALS: !Ref AllowCredentials
        REGION: !Sub ${AWS::Region}
        ENVIRONMENT: !Ref Environment
        BOOKS_TABLE: !Ref BooksTable
        BOOKS_USER_BOOK_KEY_GSI: UserBookKeyIndex
        BOOKS_FILES_UPLOADS_TABLE: !Ref BooksFilesUploadsTable
        BOOKS_UPLOAD_BUCKET: !Ref BooksUploadBucket

Resources:
  BookTrackerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${Environment}-${AppName}-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  BookTrackerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${Environment}-${AppName}-user-pool-client
      UserPoolId: !Ref BookTrackerUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  BookTrackerAppApiGW:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${Environment}-${AppName}-api
      Description: API Gateway for Book Tracker App Endpoints
      StageName: !Ref Environment
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowOrigin}'"
        AllowCredentials: !Ref AllowCredentials
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt BookTrackerUserPool.Arn
            Identity:
              Header: Authorization

  BooksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-${AppName}-books-table
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: bookId
          AttributeType: S
        - AttributeName: bookKey
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: bookId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UserBookKeyIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: bookKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  BooksFilesUploadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Environment}-${AppName}-books-files-uploads-table
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: updateId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: updateId
          KeyType: HASH
        - AttributeName: userId
          KeyType: RANGE

  BooksUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${Environment}-${AppName}-books-uploads
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - !Ref AllowOrigin
            MaxAge: 3000
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  BooksProcessingStateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub
        - /aws/vendedlogs/states/${Environment}-${AppName}-books-csv-files-processing
        - ResourceId: BooksProcessingStateMachine

  BooksProcessingStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${Environment}-${AppName}-books-csv-files-processing
      Logging:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt BooksProcessingStateMachineLogGroup.Arn
      Tracing:
        Enabled: true
      Type: STANDARD
      DefinitionUri: stepFunctions/booksCsvFilesProcessing.asl.json
      DefinitionSubstitutions:
        ValidateBooksRecordsFunctionArn: !GetAtt ValidateBooksRecordsFunction.Arn
        FileUploadsTableNameArn: !GetAtt BooksFilesUploadsTable.Arn
      Policies:
        - CloudWatchLogsFullAccess
        - CloudWatchPutMetricPolicy: {}
        - LambdaInvokePolicy:
            FunctionName: !Ref ValidateBooksRecordsFunction
        - Statement:
            - Sid: 'RulesAccess'
              Effect: Allow
              Action:
                - events:PutTargets
                - events:PutRule
                - events:DescribeRule
              Resource: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForStepFunctionsExecutionRule'
            - Sid: 'XrayAccess'
              Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
                - xray:GetSamplingRules
                - xray:GetSamplingTargets
              Resource: '*'
            - Sid: 'S3Access'
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectAttributes
              Resource:
                - !GetAtt BooksUploadBucket.Arn
                - !Sub '${BooksUploadBucket.Arn}/*'
            - Sid: 'DynamoDBAccess'
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt BooksTable.Arn
                - !GetAtt BooksFilesUploadsTable.Arn
            - Sid: 'StartExecution'
              Effect: Allow
              Action:
                - states:StartExecution
              Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Environment}-${AppName}-books-csv-files-processing'

  BooksProcessingEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${Environment}-${AppName}-books-csv-upload-rule
      Description: Trigger Step Function when CSV files are uploaded to S3
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref BooksUploadBucket
          object:
            key:
              - prefix: uploads/
              - suffix: .csv
      State: ENABLED
      Targets:
        - Arn: !Ref BooksProcessingStateMachine
          Id: BooksProcessingStateMachineTarget
          RoleArn: !GetAtt BooksProcessingEventBridgeRole.Arn

  BooksProcessingEventBridgeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${Environment}-${AppName}-eventbridge-stepfunctions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStepFunctionExecution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref BooksProcessingStateMachine

  ValidateBooksRecordsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-validate-books-records
      Description: Validate each book record from the csv file
      Handler: !Sub ${BookHandlersPath}/validateBooksRecords.handler
      Timeout: 300
      Tracing: Active
    Policies:
      - AWSLambdaBasicExecutionRole
      - Statement:
          - Sid: DynamoDBReadWrite
            Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:BatchWriteItem
            Resource:
              - !GetAtt BooksTable.Arn
              - !Sub '${BooksTable.Arn}/index/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/validateBooksRecords.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  GetImportStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-get-import-status
      Description: Get import status from database
      Handler: !Sub ${BookHandlersPath}/getImportStatus.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books/status/{updateId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt BooksFilesUploadsTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/getImportStatus.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  CreateBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-create-book
      Description: Create book record in database
      Handler: !Sub ${BookHandlersPath}/createBook.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt BooksTable.Arn
                - !Sub '${BooksTable.Arn}/index/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/createBook.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  GetAllBooksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-get-all-books
      Description: Get all books records in database
      Handler: !Sub ${BookHandlersPath}/getAllBooks.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt BooksTable.Arn
                - !Sub '${BooksTable.Arn}/index/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/getAllBooks.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  GetBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-get-book
      Description: Get book record in database
      Handler: !Sub ${BookHandlersPath}/getBook.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books/{bookId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBRead
              Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt BooksTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/getBook.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  UpdateBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-update-book
      Description: Update book record in database
      Handler: !Sub ${BookHandlersPath}/updateBook.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books/{bookId}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBUpdate
              Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt BooksTable.Arn
                - !Sub '${BooksTable.Arn}/index/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/updateBook.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  DeleteBookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-delete-book
      Description: Delete book record in database
      Handler: !Sub ${BookHandlersPath}/deleteBook.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books/{bookId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBDelete
              Effect: Allow
              Action:
                - dynamodb:DeleteItem
              Resource: !GetAtt BooksTable.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/deleteBook.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

  GeneratePresignedUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${Environment}-${AppName}-generate-presigned-url
      Description: Generate presigned URL for file upload
      Handler: !Sub ${BookHandlersPath}/generatePresignedUrl.handler
      Tracing: Active
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref BookTrackerAppApiGW
            Path: /v2/books/generate-presigned-url
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: DynamoDBWrite
              Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt BooksFilesUploadsTable.Arn
            - Sid: S3PresignedUrl
              Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub '${BooksUploadBucket.Arn}/*'
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: esm
        OutExtension:
          - .js=.mjs
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints:
          - !Sub ${BookHandlersPath}/generatePresignedUrl.ts
        Banner:
          - js=import { createRequire } from 'module'; const require = createRequire(import.meta.url);

Outputs:
  BookTrackerAppApiGW:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${BookTrackerAppApiGW}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref BookTrackerUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref BookTrackerUserPoolClient
  CreateBookFunction:
    Description: 'Create Book Lambda Function ARN'
    Value: !GetAtt CreateBookFunction.Arn
  GetAllBooksFunction:
    Description: 'Get All Books Lambda Function ARN'
    Value: !GetAtt GetAllBooksFunction.Arn
  GetBookFunction:
    Description: 'Get Book Lambda Function ARN'
    Value: !GetAtt GetBookFunction.Arn
  UpdateBookFunction:
    Description: 'Update Book Lambda Function ARN'
    Value: !GetAtt UpdateBookFunction.Arn
  DeleteBookFunction:
    Description: 'Delete Book Lambda Function ARN'
    Value: !GetAtt DeleteBookFunction.Arn
  GeneratePresignedUrlFunction:
    Description: 'Generate Presigned URL Lambda Function ARN'
    Value: !GetAtt GeneratePresignedUrlFunction.Arn
  GetImportStatusFunction:
    Description: 'Get Import Status Lambda Function ARN'
    Value: !GetAtt GetImportStatusFunction.Arn
  BooksFilesUploadsTable:
    Description: 'Books Files Uploads DynamoDB Table Name'
    Value: !Ref BooksFilesUploadsTable
  BooksUploadBucket:
    Description: 'Books Upload S3 Bucket Name'
    Value: !Ref BooksUploadBucket
  ValidateBooksRecordsFunction:
    Description: 'Validate Books Records Lambda Function ARN'
    Value: !GetAtt ValidateBooksRecordsFunction.Arn
